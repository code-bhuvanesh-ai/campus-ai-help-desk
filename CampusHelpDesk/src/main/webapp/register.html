<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Campus AI Helpdesk</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .card h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 18px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .card {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>
            Campus AI Helpdesk
        </h1>

        <p>
            Student Registration
        </p>

    </header>


    <div class="container">

        <div class="card">

            <h2>
                Create Student Account
            </h2>

            <p class="subtitle">
                Register to create and track your helpdesk tickets.
            </p>


            <form action="register" method="post">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>


                <button type="submit">
                    Create Account
                </button>


            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </div>

        </div>

    </div>


    <footer>

        © 2026 Campus AI Helpdesk

    </footer>

</body>

</html>
