<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Campus AI Helpdesk</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h2 {
            text-align: center;
            margin: 0;
            color: #243b55;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin: 12px 0 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #243b55;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172a3a;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #243b55;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 7px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h2>
            Forgot Password?
        </h2>

        <p class="subtitle">
            Enter your registered email address
            to reset your password.
        </p>

        <form action="forgot-password" method="post">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required>

            <button type="submit">
                Continue
            </button>

        </form>

        <div class="back">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

        <div class="info">
            Make sure you enter the same email
            used during registration.
        </div>

    </div>

</body>

</html>
